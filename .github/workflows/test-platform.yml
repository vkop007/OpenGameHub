name: Test OpenGameHub Platform

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-platform:
    name: Typecheck, Lint, Unit, Integration & E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Lint Checks
        run: pnpm lint

      - name: Run TypeScript Checks
        run: pnpm typecheck

      - name: Run Unit & Integration Tests
        run: pnpm test

      - name: Build Games & Next.js Platform
        run: pnpm build

      - name: Run Browser E2E Tests
        run: pnpm test:e2e
